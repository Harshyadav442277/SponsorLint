name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lightweight-verification:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-demo.txt

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-demo.txt "pytest>=8,<10" "pytest-cov>=5,<8" "httpx>=0.27,<1"

      - name: Run zero-key demo arc
        run: python -m sponsorlint demo --arc

      - name: Run adversarial evaluation
        run: python -m sponsorlint eval

      - name: Run tests
        run: python -m pytest tests -q --cov --cov-report=term-missing

      # One version publishes the numbers; the rest just measure them. The
      # matrix still installs only the demo requirements, so the optional
      # pypdf, Whisper and LLM paths report as uncovered here by design.
      - name: Publish coverage summary
        if: always() && matrix.python-version == '3.12'
        run: |
          {
            echo '### Coverage'
            echo
            echo '```'
            python -m coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
